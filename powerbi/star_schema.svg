<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
<rect width="1100" height="640" fill="#FAFCFD"/>
<style>text{font-family:Arial,sans-serif;fill:#142D40}.title{font-size:26px;font-weight:bold}.head{font-size:20px;font-weight:bold}.body{font-size:16px}.note{font-size:14px;fill:#526778}.dim{fill:#E5F3F2;stroke:#128C7E;stroke-width:2}.fact{fill:#E8F0F7;stroke:#176B91;stroke-width:2}.line{fill:none;stroke:#176B91;stroke-width:3;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#176B91"/></marker></defs>
<text x="40" y="48" class="title">OLIST / Dimensional model and filter direction</text>
<text x="40" y="78" class="note">One-to-many relationships · single-direction filtering · validated primary keys</text>
<rect x="40" y="130" width="240" height="125" rx="12" class="dim"/>
<text x="60" y="163" class="head">DimCustomer</text><text x="60" y="193" class="body">PK customer_unique_id</text><text x="60" y="222" class="note">First-observed geography</text>
<rect x="40" y="335" width="240" height="125" rx="12" class="dim"/>
<text x="60" y="368" class="head">DimDate</text><text x="60" y="398" class="body">PK date</text><text x="60" y="427" class="note">Continuous daily calendar</text>
<rect x="370" y="220" width="270" height="175" rx="12" class="fact"/>
<text x="392" y="254" class="head">FactOrders</text><text x="392" y="283" class="body">PK order_id</text><text x="392" y="311" class="body">One row per order</text><text x="392" y="340" class="note">Aggregated item/payment values</text><text x="392" y="367" class="note">Explicit eligibility and outcomes</text>
<rect x="775" y="225" width="275" height="175" rx="12" class="fact"/>
<text x="797" y="259" class="head">FactOrderItems</text><text x="797" y="289" class="body">PK order_id + order_item_id</text><text x="797" y="318" class="body">One row per purchased item</text><text x="797" y="347" class="note">Item price and freight</text><text x="797" y="374" class="note">Product and seller keys</text>
<rect x="775" y="95" width="275" height="90" rx="12" class="dim"/>
<text x="797" y="130" class="head">DimProduct</text><text x="797" y="160" class="body">PK product_id · category</text>
<rect x="775" y="470" width="275" height="90" rx="12" class="dim"/>
<text x="797" y="505" class="head">DimSeller</text><text x="797" y="535" class="body">PK seller_id · geography</text>
<path d="M280 190 H325 V270 H370" class="line"/><text x="291" y="176" class="note">1</text><text x="350" y="257" class="note">*</text>
<path d="M280 397 H325 V350 H370" class="line"/><text x="291" y="424" class="note">1</text><text x="350" y="337" class="note">*</text>
<path d="M640 307 H775" class="line"/><text x="666" y="292" class="note">1 → *</text>
<path d="M912 185 V225" class="line"/><text x="930" y="211" class="note">1 → *</text>
<path d="M912 470 V400" class="line"/><text x="930" y="442" class="note">1 → *</text>
<text x="40" y="524" class="body">No payment-to-item join. No bidirectional loops.</text>
<text x="40" y="556" class="note">Order-level experience under category/seller filters uses explicit order-ID propagation.</text>
<text x="40" y="605" class="note">FactPayments and FactReviews remain separate audit exports; they are not required in the core BI model.</text>
</svg>
